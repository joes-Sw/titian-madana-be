services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spse
      POSTGRES_PASSWORD: spse
      POSTGRES_DB: spse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spse"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://spse:spse@db:5432/spse
      TAHUN: "2026"
      SCHEDULER_ENABLED: "true"
      SCRAPE_INTERVAL_HOURS: "6"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
